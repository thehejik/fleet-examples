apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx-index
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Region Check</title></head>
    <body>
      <h1>Cluster Region: {{ .Values.region }}</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: {{ .Release.Name }}-nginx-index
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx-svc
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: {{ .Release.Name }}-nginx
